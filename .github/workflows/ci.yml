name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check

  android:
    name: Android build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
        with:
          gradle-wrapper-path: android/gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
      - run: set +o pipefail; yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./android/gradlew -p android ktlintCheck testDebugUnitTest lint assembleDebug

  android-emulator:
    name: Android emulator smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: ""
      - uses: gradle/actions/setup-gradle@v4
      - run: set +o pipefail; yes | sdkmanager --licenses >/dev/null
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -eu
            capture_logcat() {
              adb logcat -d -t 3000 > android/app/build/emulator-smoke-logcat.txt 2>&1 || true
            }
            trap capture_logcat ERR
            ./android/gradlew -p android installDebug
            adb shell am start -W -n com.discoveraibrowser/.MainActivity
            sleep 5
            pid="$(adb shell pidof -s com.discoveraibrowser | tr -d '\r' || true)"
            if [ -z "$pid" ]; then
              echo "Discover AI Browser process exited after launch." >&2
              exit 1
            fi
            echo "Discover AI Browser launched and remained alive with PID $pid."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-smoke-logcat
          path: android/app/build/emulator-smoke-logcat.txt
          if-no-files-found: ignore
